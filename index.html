<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive 3D Cosmic Observatory - Explore the universe in your browser" />
  <title>Stellar Nexus - Interactive 3D Universe Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #020108; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #e2e8f0; }
    #viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    #hud-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; }
    .hud-element { pointer-events: auto; background: rgba(8, 12, 28, 0.72); border: 1px solid rgba(56, 189, 248, 0.28); border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 0 35px rgba(2, 132, 199, 0.15); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 22px; }
    .brand-title { font-size: 20px; font-weight: 800; letter-spacing: 4px; background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
    .nav-controls { display: flex; gap: 12px; align-items: center; }
    select, button { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.35); color: #7dd3fc; padding: 8px 16px; border-radius: 6px; font-size: 13px; letter-spacing: 1px; cursor: pointer; outline: none; transition: all 0.25s ease; }
    select:hover, button:hover { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); color: #ffffff; }
    #info-panel { position: absolute; right: 24px; top: 90px; width: 380px; padding: 24px; display: none; animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .panel-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 10px; margin-bottom: 14px; }
    .object-name { font-size: 24px; font-weight: 800; color: #f8fafc; letter-spacing: 1px; }
    .object-type { font-size: 11px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .spec-card { background: rgba(15, 23, 42, 0.55); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .spec-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .spec-val { font-size: 13px; font-weight: 600; color: #e2e8f0; margin-top: 3px; }
    .object-bio { font-size: 13px; line-height: 1.6; color: #cbd5e1; margin-bottom: 16px; }
    .btn-warp { width: 100%; background: linear-gradient(90deg, #0284c7, #6366f1); color: #ffffff; border: none; font-weight: 700; padding: 10px; }
    .bottom-bar { align-self: center; padding: 8px 24px; font-size: 12px; color: #94a3b8; letter-spacing: 1.5px; display: flex; gap: 24px; }
    .key-hint { color: #38bdf8; font-weight: 700; }
    #tooltip { position: absolute; background: rgba(2, 6, 23, 0.88); border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 4px; font-size: 12px; letter-spacing: 1px; color: #38bdf8; pointer-events: none; opacity: 0; transform: translate(-50%, -140%); transition: opacity 0.15s ease; z-index: 100; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="top-bar hud-element">
      <div class="brand-title">Stellar Nexus</div>
      <div class="nav-controls">
        <select id="teleport-select">
          <option value="" disabled selected>Navigate Destination...</option>
          <optgroup label="Galaxies & Centers">
            <option value="sgr_a">Milky Way Center (Sagittarius A*)</option>
            <option value="andromeda">Andromeda Galaxy (M31)</option>
            <option value="triangulum">Triangulum Galaxy (M33)</option>
            <option value="sombrero">Sombrero Galaxy (M104)</option>
            <option value="whirlpool">Whirlpool Galaxy (M51)</option>
            <option value="pinwheel">Pinwheel Galaxy (M101)</option>
          </optgroup>
          <optgroup label="Stellar Nurseries & Relics">
            <option value="pillars">Pillars of Creation (Eagle Nebula)</option>
            <option value="orion_neb">Orion Nebula (M42)</option>
            <option value="crab_neb">Crab Nebula (M1)</option>
            <option value="vega_neb">Veil Nebula (Cygnus Loop)</option>
            <option value="helix_neb">Helix Nebula (NGC 7293)</option>
          </optgroup>
          <optgroup label="Solar System">
            <option value="sol">The Sun (Solar Origin)</option>
            <option value="earth">Earth (Blue Planet)</option>
            <option value="jupiter">Jupiter (Gas Giant)</option>
            <option value="saturn">Saturn (Ringed Wonder)</option>
            <option value="mars">Mars (Red Planet)</option>
          </optgroup>
          <optgroup label="Famous Stars">
            <option value="sirius">Sirius A / B (Dog Star)</option>
            <option value="betelgeuse">Betelgeuse (Red Supergiant)</option>
            <option value="rigel">Rigel (Blue Supergiant)</option>
            <option value="vy_cma">VY Canis Majoris (Hypergiant)</option>
            <option value="polaris">Polaris (North Star)</option>
          </optgroup>
        </select>
        <button id="btn-orbit-mode">ORBIT MODE: FREE</button>
        <button id="btn-audio">AUDIO: OFF</button>
        <button id="btn-reset">RESET VIEW</button>
      </div>
    </div>
    <div id="info-panel" class="hud-element">
      <div class="panel-header">
        <div>
          <h2 id="info-title" class="object-name">Celestial Body</h2>
          <div id="info-type" class="object-type">Classification</div>
        </div>
        <button id="btn-close-panel" style="padding: 2px 8px;">X</button>
      </div>
      <div class="spec-grid">
        <div class="spec-card"><div class="spec-label">Distance from Earth</div><div id="spec-dist" class="spec-val">-</div></div>
        <div class="spec-card"><div class="spec-label">Constellation</div><div id="spec-const" class="spec-val">-</div></div>
        <div class="spec-card"><div class="spec-label">Mass / Solar Equiv.</div><div id="spec-mass" class="spec-val">-</div></div>
        <div class="spec-card"><div class="spec-label">Diameter / Radius</div><div id="spec-size" class="spec-val">-</div></div>
      </div>
      <p id="info-desc" class="object-bio"></p>
      <button id="btn-orbit" class="btn-warp">ENGAGE CLOSE ORBIT</button>
    </div>

    <div class="bottom-bar hud-element">
      <div><span class="key-hint">DRAG</span> Orbit / Rotate</div>
      <div><span class="key-hint">RIGHT-CLICK DRAG</span> Pan Space</div>
      <div><span class="key-hint">SCROLL</span> Hyperspace Zoom</div>
      <div><span class="key-hint">CLICK</span> Inspect Celestial Object</div>
      <div><span class="key-hint">SHIFT + CLICK</span> Toggle Constellation</div>
    </div>
  </div>

  <div id="tooltip"></div>
  <canvas id="viewport"></canvas>

        desc: "Famous for its bulbous white nucleus and prominent dust lanes. Harbors a 1 billion solar mass black hole.",

      },
      whirlpool: {
        name: "Whirlpool Galaxy (M51)", type: "Grand Design Spiral (SA(s)bc)",
        dist: "23 Million Light Years", constellation: "Canes Venatici",
        mass: "840 Billion M☉", size: "60,000 Light Years (Diameter)",
        desc: "Classic grand-design spiral interacting with companion galaxy NGC 5195. First spiral nebula classified by Lord Rosse.",
        pos: new THREE.Vector3(1000, -300, -650), cameraDist: 150, color: 0xffc107
      },
      pinwheel: {
        name: "Pinwheel Galaxy (M101)", type: "Spiral Galaxy (SAc(s)cd)",
        dist: "21.6 Million Light Years", constellation: "Ursa Major",
        mass: "1 Trillion M☉", size: "60,000 Light Years (Diameter)",
        desc: "Face-on spiral nearly 3x the Milky Way's diameter. Contains giant H II regions and over 1 trillion stars.",
        pos: new THREE.Vector3(-900, -250, 550), cameraDist: 160, color: 0x22c55e
      }
    };
    let audioCtx = null;
    let isAudioPlaying = false;
    let orbitMode = 'free';
    let orbitTarget = null;
    let isTransitioning = false;
    let flightStart = 0;
    const flightDuration = 1800;
    const camOrigin = new THREE.Vector3();
    const camDest = new THREE.Vector3();
    const targetOrigin = new THREE.Vector3();
    const targetDest = new THREE.Vector3();
    let currentSelectedKey = null;
    let constellations = [];

    function toggleAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const baseFreqs = [55, 110, 164.81, 220];
        baseFreqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const panner = audioCtx.createStereoPanner();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          setInterval(() => {
            if (audioCtx.state === 'running') {
              osc.frequency.setTargetAtTime(freq + (Math.random() - 0.5) * 1.5, audioCtx.currentTime, 3);
            }
          }, 3000);
          gain.gain.setValueAtTime(0.04 / (idx + 1), audioCtx.currentTime);
          panner.pan.setValueAtTime((idx / baseFreqs.length) * 2 - 1, audioCtx.currentTime);
          osc.connect(gain); gain.connect(panner); panner.connect(audioCtx.destination);
          osc.start();
        });
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isAudioPlaying = !isAudioPlaying;
      if (!isAudioPlaying) audioCtx.suspend();
      document.getElementById('btn-audio').innerText = `AUDIO: ${isAudioPlaying ? 'ON' : 'OFF'}`;
    }

    function toggleOrbitMode() {
      orbitMode = orbitMode === 'free' ? 'locked' : 'free';
      document.getElementById('btn-orbit-mode').innerText = `ORBIT MODE: ${orbitMode.toUpperCase()}`;
      if (orbitMode === 'free') {
        controls.enableRotate = true;
        orbitTarget = null;
      } else {
        controls.enableRotate = !orbitTarget;
      }
    }

    const canvas = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020108, 0.0006);
    scene.background = new THREE.Color(0x020108);

    // Enhanced starfield background
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 5000;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 8000;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.85 });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    // Distant galaxies background
    for (let i = 0; i < 200; i++) {
      const galaxyGeo = new THREE.IcosahedronGeometry(1, 0);
      const galaxyMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(Math.random() * 0.2 + 0.6, 0.6, 0.55),
        transparent: true, opacity: 0.12
      });
      const galaxy = new THREE.Mesh(galaxyGeo, galaxyMat);
      galaxy.position.set(
        (Math.random() - 0.5) * 6000,
        (Math.random() - 0.5) * 4000,
        (Math.random() - 0.5) * 6000
      );
      galaxy.scale.setScalar(Math.random() * 5 + 3);
      scene.add(galaxy);
    }

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 8000);
    camera.position.set(240, 210, 320);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputEncoding = THREE.sRGBEncoding;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 2500;
    controls.minDistance = 2;

    // Enhanced galaxy generator with nebula effect
    function createGalaxy(particleCount, radius, arms, spin, coreColor, outerColor, centerOffset) {
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);
      const colorInside = new THREE.Color(coreColor);
      const colorOutside = new THREE.Color(outerColor);
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const r = Math.pow(Math.random(), 2.2) * radius;
        const armAngle = ((i % arms) * 2 * Math.PI) / arms;
        const spinAngle = r * spin;
        const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3) * r;
        const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.18) * r;
        const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3) * r;
        positions[i3] = centerOffset.x + Math.cos(armAngle + spinAngle) * r + randomX;
        positions[i3 + 1] = centerOffset.y + randomY;
        positions[i3 + 2] = centerOffset.z + Math.sin(armAngle + spinAngle) * r + randomZ;
        const mixedColor = colorInside.clone().lerp(colorOutside, r / radius);
        colors[i3] = mixedColor.r; colors[i3 + 1] = mixedColor.g; colors[i3 + 2] = mixedColor.b;
      }
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const canvasTex = document.createElement('canvas');
      canvasTex.width = 64; canvasTex.height = 64;
      const ctx = canvasTex.getContext('2d');
      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.25, 'rgba(255,255,255,0.8)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      const texture = new THREE.CanvasTexture(canvasTex);
      const material = new THREE.PointsMaterial({
        size: 2.5, sizeAttenuation: true, depthWrite: false,
        blending: THREE.AdditiveBlending, vertexColors: true,
        map: texture, transparent: true
      });
      return new THREE.Points(geometry, material);
    }
    // Spawn Milky Way with nebula overlay
    const milkyWay = createGalaxy(120000, 380, 4, 0.014, 0xffe8bb, 0x38bdf8, new THREE.Vector3(0, 0, 0));
    scene.add(milkyWay);

    const andromedaMesh = createGalaxy(60000, 280, 2, 0.016, 0xffd1ff, 0x818cf8, ASTRONOMICAL_DATA.andromeda.pos);
    andromedaMesh.rotation.x = 0.45; andromedaMesh.rotation.z = -0.3;
    scene.add(andromedaMesh);

    const triangulumMesh = createGalaxy(25000, 140, 2, 0.018, 0xdcfce7, 0x38bdf8, ASTRONOMICAL_DATA.triangulum.pos);
    scene.add(triangulumMesh);

    // Additional galaxies
    const whirlpoolGalaxy = createGalaxy(35000, 180, 2, 0.015, 0xffecb3, 0xfb9246, ASTRONOMICAL_DATA.whirlpool.pos);
    whirlpoolGalaxy.rotation.x = -0.6; whirlpoolGalaxy.rotation.z = 0.9;
    scene.add(whirlpoolGalaxy);

    const pinwheelGalaxy = createGalaxy(40000, 160, 3, 0.013, 0xaaffb3, 0x60e696, ASTRONOMICAL_DATA.pinwheel.pos);
    pinwheelGalaxy.rotation.x = 0.2; pinwheelGalaxy.rotation.z = 0.5;
    scene.add(pinwheelGalaxy);

    // Nebula effect: volumetric particle clouds for interesting locations
    function createNebula(center, count, radius, color) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const phi = Math.random() * Math.PI * 2;
        const theta = Math.random() * Math.PI;
        const r = Math.pow(Math.random(), 0.7) * radius;
        positions[i3] = center.x + Math.sin(theta) * Math.cos(phi) * r;
        positions[i3 + 1] = center.y + Math.sin(theta) * Math.sin(phi) * r;
        positions[i3 + 2] = center.z + Math.cos(theta) * r;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        size: 4, sizeAttenuation: true, transparent: true, opacity: 0.5,
        color: color, blending: THREE.AdditiveBlending, depthWrite: false
      });
      return new THREE.Points(geo, mat);
    }

    // Add nebula clouds at key locations
    scene.add(createNebula(ASTRONOMICAL_DATA.pillars.pos.clone(), 5000, 50, 0x2dd4bf));
    scene.add(createNebula(ASTRONOMICAL_DATA.orion_neb.pos.clone(), 6000, 35, 0xd946ef));
    scene.add(createNebula(ASTRONOMICAL_DATA.crab_neb.pos.clone(), 4000, 30, 0x38bdf8));
    scene.add(createNebula(ASTRONOMICAL_DATA.vega_neb.pos.clone(), 7000, 80, 0x60a5fa));
    scene.add(createNebula(ASTRONOMICAL_DATA.helix_neb.pos.clone(), 4500, 30, 0x10b981));

    // Deep space star cluster for variety
    const clusterGeo = new THREE.BufferGeometry();
    const clusterPositions = new Float32Array(3000 * 3);
    for (let i = 0; i < 3000 * 3; i += 3) {
      const theta = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 2) * 30 + 5;
      clusterPositions[i] = Math.cos(theta) * r + -50;
      clusterPositions[i + 1] = (Math.random() - 0.5) * r * 0.4;
      clusterPositions[i + 2] = Math.sin(theta) * r + 30;
    }
    clusterGeo.setAttribute('position', new THREE.BufferAttribute(clusterPositions, 3));
    const cluster = new THREE.Points(clusterGeo, new THREE.PointsMaterial({
      color: 0xffd54f, size: 1.5, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    scene.add(cluster);
    // Ambient lighting for scene depth
    const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambientLight);

    // Celestial objects
    const interactiveObjects = [];

    // Sgr A* Black Hole
    const sgrGroup = new THREE.Group();
    const bhCore = new THREE.Mesh(
      new THREE.SphereGeometry(3.5, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.95 })
    );
    sgrGroup.add(bhCore);
    const accretionGeo = new THREE.RingGeometry(4.2, 14.5, 128);
    const accretionMat = new THREE.ShaderMaterial({
      uniforms: {
        color: { value: new THREE.Color(0xff8800) },
        time: { value: 0 },
        progress: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `,
      fragmentShader: `
        uniform vec3 color;
        uniform float time;
        varying vec2 vUv;
        void main() {
          float d = distance(vUv, vec2(0.5));
          float alpha = 0.5 * exp(-d * 10.0) + 0.3 * exp(-d * 30.0);
          alpha *= 0.3 + 0.7 * sin(time * 3.0 + d * 50.0);
          gl_FragColor = vec4(color, alpha);
        }
      `,
      side: THREE.DoubleSide, transparent: true, depthWrite: false
    });
    const accretionDisk = new THREE.Mesh(accretionGeo, accretionMat);
    accretionDisk.rotation.x = Math.PI / 2.3;
    sgrGroup.add(accretionDisk);
    sgrGroup.userData = { key: "sgr_a" };
    scene.add(sgrGroup);
    bhCore.userData = { key: "sgr_a" };

    // Ray-sphere helper for black hole
    const bhGlow = new THREE.Mesh(
      new THREE.SphereGeometry(5.8, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff6a00, transparent: true, opacity: 0.15, side: THREE.BackSide })
    );
    sgrGroup.add(bhGlow);
    interactiveObjects.push(bhCore);
    // Helper: create glow material
    function createGlowMesh(radius, color) {
      const glowMat = new THREE.ShaderMaterial({
        uniforms: { color: { value: new THREE.Color(color) }, },
        vertexShader: `
          varying vec3 vNormal;
          void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: `
          uniform vec3 color;
          varying vec3 vNormal;
          void main() { float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1)), 2.0); gl_FragColor = vec4(color * intensity, intensity * 0.8); }
        `,
        blending: THREE.AdditiveBlending, transparent: true, side: THREE.FrontSide
      });
      return new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), glowMat);
    }

    // Helper: create ring system (for Saturn)
    function createRingSystem(inner, outer) {
      const ringGeo = new THREE.RingGeometry(inner, outer, 128);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xf4d03f, transparent: true, opacity: 0.45, side: THREE.DoubleSide
      });
      return new THREE.Mesh(ringGeo, ringMat);
    }

    // Helper: create planet with atmospheric glow
    function createPlanet(data, size = 1.2, innerSize = 2) {
      const group = new THREE.Group();
      group.position.copy(data.pos);

      const sphereGeo = new THREE.SphereGeometry(size, 32, 32);
      const sphereMat = new THREE.MeshBasicMaterial({ color: data.color });
      const starMesh = new THREE.Mesh(sphereGeo, sphereMat);
      starMesh.userData = { key: Object.keys(ASTRONOMICAL_DATA).find(k => ASTRONOMICAL_DATA[k] === data) };
      group.add(starMesh);

      // Glow ring for atmosphere effect
      const glowGeo = new THREE.RingGeometry(size, innerSize, 32);
      const glowMat = new THREE.MeshBasicMaterial({
        color: data.color, side: THREE.DoubleSide, transparent: true, opacity: 0.4
      });
      const glowMesh = new THREE.Mesh(glowGeo, glowMat);
      group.add(glowMesh);

      // Atmospheric glow
      const atmosphere = createGlowMesh(size * 1.2, data.color);
      group.add(atmosphere);

      scene.add(group);
      interactiveObjects.push(starMesh);
      return group;
    }

    // Create all celestial objects
    Object.keys(ASTRONOMICAL_DATA).forEach(key => {
      if (key === 'sgr_a') return;
      const data = ASTRONOMICAL_DATA[key];
      const group = createPlanet(data);

      // Special: Saturn rings
      if (key === 'saturn') {
        const rings = createRingSystem(1.5, 3);
        rings.rotation.x = Math.PI / 2.3;
        group.add(rings);
      }
    });
    // Constellation lines (connecting celestial objects)
    function createConstellationLine(objA, objB, color = 0x38bdf8) {
      const geometry = new THREE.BufferGeometry().setFromPoints([objA.position, objB.position]);
      const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.25 });
      const line = new THREE.Line(geometry, material);
      scene.add(line);
      return line;
    }

    const objectGroups = {};
    Object.keys(ASTRONOMICAL_DATA).forEach(key => {
      objectGroups[key] = scene.getObjectByName(key) || ASTRONOMICAL_DATA[key].pos;
    });

    // Connect notable celestial objects with subtle constellation lines
    const notableKeys = ['sirius', 'rigel', 'betelgeuse', 'polaris', 'sol'];
    for (let i = 0; i < notableKeys.length; i++) {
      const next = (i + 1) % notableKeys.length;
      const a = ASTRONOMICAL_DATA[notableKeys[i]].pos;
      const b = ASTRONOMICAL_DATA[notableKeys[next]].pos;
      createConstellationLine({ position: a }, { position: b });
    }

    // Tooltip
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);
      if (intersects.length > 0) {
        const key = intersects[0].object.userData.key;
        const data = ASTRONOMICAL_DATA[key];
        tooltip.style.opacity = '1';
        tooltip.style.left = `${e.clientX}px`;
        tooltip.style.top = `${e.clientY}px`;
        tooltip.innerText = `${data.name} [${data.type}]`;
        document.body.style.cursor = 'pointer';
      } else {
        tooltip.style.opacity = '0';
        document.body.style.cursor = 'default';
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.closest('.hud-element')) return;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);
      if (intersects.length > 0) {
        const key = intersects[0].object.userData.key;
        travelTo(key);
      }
    });
    function travelTo(key) {
      const data = ASTRONOMICAL_DATA[key];
      if (!data) return;
      currentSelectedKey = key;
      isTransitioning = true;
      flightStart = performance.now();
      camOrigin.copy(camera.position);
      targetOrigin.copy(controls.target);
      targetDest.copy(data.pos);
      const offset = new THREE.Vector3(data.cameraDist * 0.7, data.cameraDist * 0.4, data.cameraDist).normalize().multiplyScalar(data.cameraDist);
      camDest.copy(data.pos).add(offset);
      showObjectInfo(key);
    }

    function showObjectInfo(key) {
      const data = ASTRONOMICAL_DATA[key];
      document.getElementById('info-title').innerText = data.name;
      document.getElementById('info-type').innerText = data.type;
      document.getElementById('spec-dist').innerText = data.dist;
      document.getElementById('spec-const').innerText = data.constellation;
      document.getElementById('spec-mass').innerText = data.mass;
      document.getElementById('spec-size').innerText = data.size;
      document.getElementById('info-desc').innerText = data.desc;
      document.getElementById('info-panel').style.display = 'block';
      document.getElementById('teleport-select').value = key;
    }

    // UI Event Listeners
    document.getElementById('teleport-select').addEventListener('change', (e) => travelTo(e.target.value));
    document.getElementById('btn-orbit').addEventListener('click', () => { if (currentSelectedKey) travelTo(currentSelectedKey); });
    document.getElementById('btn-orbit-mode').addEventListener('click', toggleOrbitMode);
    document.getElementById('btn-close-panel').addEventListener('click', () => {
      document.getElementById('info-panel').style.display = 'none';
    });
    document.getElementById('btn-audio').addEventListener('click', toggleAudio);
    document.getElementById('btn-reset').addEventListener('click', () => {
      isTransitioning = true;
      flightStart = performance.now();
      camOrigin.copy(camera.position);
      targetOrigin.copy(controls.target);
      targetDest.set(0, 0, 0);
      camDest.set(240, 210, 320);
      document.getElementById('info-panel').style.display = 'none';
      document.getElementById('teleport-select').selectedIndex = 0;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' && !isTransitioning) toggleOrbitMode();
      if (e.key === 'Escape') document.getElementById('btn-reset').click();
    });
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      // Rotate galaxies slowly
      milkyWay.rotation.y = elapsed * 0.008;
      andromedaMesh.rotation.y = -elapsed * 0.006;
      triangulumMesh.rotation.y = elapsed * 0.004;
      whirlpoolGalaxy.rotation.y = -elapsed * 0.005;
      pinwheelGalaxy.rotation.y = elapsed * 0.003;

      // Animate accretion disk shader
      if (accretionMat.uniforms) accretionMat.uniforms.time.value = elapsed;

      // Orbit mode: lock target on selected object
      if (orbitMode === 'locked' && currentSelectedKey) {
        const data = ASTRONOMICAL_DATA[currentSelectedKey];
        targetDest.copy(data.pos);
        controls.target.lerp(targetDest, 0.05);
      }

      // Billboard glow coronal rings
      interactiveObjects.forEach(obj => {
        if (obj.parent && obj.parent.children[1]) {
          obj.parent.children[1].lookAt(camera.position);
        }
      });

      // Camera flight transitions
      if (isTransitioning) {
        const t = Math.min((performance.now() - flightStart) / flightDuration, 1.0);
        const ease = 1 - Math.pow(1 - t, 5);
        camera.position.lerpVectors(camOrigin, camDest, ease);
        controls.target.lerpVectors(targetOrigin, targetDest, ease);
        if (t >= 1.0) isTransitioning = false;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
    window.scene = scene;
  </script>
</body>
</html>
